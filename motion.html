<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warmup Esport — Motion design</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,800;1,800&family=Barlow:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --violet: #8b3dff; --violet-2: #b07cff; --bg: #050505; --line: rgba(255,255,255,.12); }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: #fff; font-family: Barlow, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
    .stage { position: relative; flex: 1; min-height: 0; }
    canvas { position: absolute; inset: 16px; margin: auto; display: block; max-width: calc(100% - 32px); max-height: calc(100% - 32px); width: auto; height: auto; border-radius: 8px; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px var(--line); background: #000; }
    .big-play {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 96px; height: 96px; border-radius: 50%;
      border: 0; background: var(--violet); color: #fff; font-size: 34px; cursor: pointer; box-shadow: 0 0 0 0 rgba(139,61,255,.6); animation: pulse 2s infinite;
    }
    .big-play.hidden { display: none; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 26px rgba(139,61,255,0); } 100% { box-shadow: 0 0 0 0 rgba(139,61,255,0); } }
    .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 20px 18px; border-top: 1px solid var(--line); background: #0b0911; }
    .bar button, .seg button {
      height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: #15111f; color: #fff;
      font: 600 13px Barlow, sans-serif; cursor: pointer; transition: background .2s, border-color .2s;
    }
    .bar button:hover { border-color: var(--violet-2); }
    .bar button:disabled { opacity: .4; cursor: not-allowed; }
    #play { width: 44px; padding: 0; font-size: 16px; }
    #scrub { flex: 1; min-width: 160px; accent-color: var(--violet); }
    #time { font: 600 13px Barlow, sans-serif; color: rgba(255,255,255,.7); min-width: 92px; font-variant-numeric: tabular-nums; }
    .seg { display: inline-flex; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
    .seg button { border: 0; border-radius: 0; }
    .seg button.on { background: var(--violet); }
    #export { background: var(--violet); border-color: var(--violet); }
    #export.rec { background: #d2264b; border-color: #d2264b; }
    #status { width: 100%; font-size: 12px; color: rgba(255,255,255,.55); }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="mv" width="1920" height="1080"></canvas>
    <button class="big-play" aria-label="Lancer">▶</button>
  </div>
  <div class="bar">
    <button id="play" aria-label="Lecture / pause">▶</button>
    <button id="restart">↺ Recommencer</button>
    <input id="scrub" type="range" min="0" max="30" step="0.01" value="0" aria-label="Position">
    <span id="time">0.0 / 30.0 s</span>
    <div class="seg" role="group" aria-label="Format">
      <button data-f="16x9" class="on">16:9 · YouTube</button>
      <button data-f="9x16">9:16 · TikTok / Reels</button>
    </div>
    <button id="sound">🔊 Son</button>
    <button id="export">⬇ Exporter la vidéo</button>
    <p id="status">Espace = lecture/pause. L'export enregistre la vidéo en temps réel (30 s) : garde cet onglet ouvert et visible pendant l'enregistrement.</p>
  </div>

  <script src="js/data.js"></script>
  <script src="js/motion.js"></script>
</body>
</html>
