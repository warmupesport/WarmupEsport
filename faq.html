<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ — Warmup Esport</title>
  <meta name="description" content="Questions fréquentes : commandes, livraison, retours, équipe et recrutement.">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=Barlow:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="faq">
  <main>
    <section class="page-hero">
      <img class="bg-logo" src="assets/logo.png" alt="">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">Accueil</a> / FAQ</div>
        <h1>Une <span class="grad">question ?</span></h1>
        <p class="lead">Tout ce qu'il faut savoir sur la boutique, la livraison et l'équipe.</p>
      </div>
    </section>

    <section class="section" style="padding-top:60px">
      <div class="container faq-layout">
        <nav class="faq-nav" aria-label="Catégories"></nav>
        <div>
          <div class="faq-search"><input id="faq-search" type="search" placeholder="Rechercher une question…" aria-label="Rechercher"></div>
          <div class="faq-list"></div>
          <div class="feature" style="margin-top:48px;grid-template-columns:1fr;padding:36px">
            <div>
              <h3 style="text-transform:uppercase">Pas trouvé ta réponse ?</h3>
              <p style="color:var(--muted)">Notre équipe te répond en général sous 48h.</p>
              <a href="contact.html" class="btn">Nous contacter <span class="arrow">→</span></a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
